<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Kana Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: tab bar (Chart · Multiple choice · Recall · Timed drill) over two columns — the active tool on the left, the gojūon chart (reference + section picker) on the right; stacks on phones. */
:root{
  --paper:#ECEFF3; --sheet:#FAFBFC; --ink:#18202C; --muted:#5A6474; --line:#CBD2DC; --guide:#C9D3E3;
  --indigo:#2F4C8C; --indigo-soft:#DDE4F2; --on-indigo:#FFFFFF;
  --learn:#A8640F; --learn-soft:#F5E6CD; --done:#3B7548; --done-soft:#DAEADC; --miss:#B03A3A; --miss-soft:#F5DEDE;
  --f-kana:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10141A; --sheet:#181E27; --ink:#E5E9EF; --muted:#98A2B1; --line:#2C3441; --guide:#2E3A52;
  --indigo:#93ACE8; --indigo-soft:#232F49; --on-indigo:#0F1522;
  --learn:#E2A553; --learn-soft:#3A2D1A; --done:#80BE8D; --done-soft:#1D3124; --miss:#E37F7F; --miss-soft:#3D2222;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10141A; --sheet:#181E27; --ink:#E5E9EF; --muted:#98A2B1; --line:#2C3441; --guide:#2E3A52;
  --indigo:#93ACE8; --indigo-soft:#232F49; --on-indigo:#0F1522;
  --learn:#E2A553; --learn-soft:#3A2D1A; --done:#80BE8D; --done-soft:#1D3124; --miss:#E37F7F; --miss-soft:#3D2222;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.square:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
h1{margin:0;font-family:var(--f-kana);font-weight:600;font-size:1.7rem;letter-spacing:.02em;display:flex;align-items:baseline;gap:.5em}
h1 small{font-family:var(--f-ui);font-weight:500;font-size:.8rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.save{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.save i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.save.ok i{background:var(--done)}

.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:5px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:9px 6px;font-weight:700;font-size:.9rem;color:var(--muted);line-height:1.2}
.tabs button small{display:block;font-weight:400;font-size:.72rem}
.tabs button[aria-pressed="true"]{background:var(--indigo);color:var(--on-indigo)}
@media (max-width:520px){.tabs button{font-size:.8rem;padding:8px 2px}.tabs button small{display:none}}

.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:1fr}}

.panel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.label{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* Left tool */
.tool{display:flex;flex-direction:column;gap:14px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:4px 12px;font-size:.82rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--indigo);color:var(--on-indigo)}
.square{position:relative;aspect-ratio:1;max-width:100%;width:min(100%,300px);margin:0 auto;border:1.5px solid var(--indigo);border-radius:4px;display:grid;place-items:center;user-select:none;background:var(--sheet)}
.square.tap{cursor:pointer}
.square.small{width:min(100%,180px)}
.square::before,.square::after{content:"";position:absolute;pointer-events:none}
.square::before{left:50%;top:6%;bottom:6%;border-left:1.5px dashed var(--guide)}
.square::after{top:50%;left:6%;right:6%;border-top:1.5px dashed var(--guide)}
.prompt{position:relative;z-index:1;font-family:var(--f-kana);font-size:clamp(6rem,24vw,9.5rem);line-height:1}
.square.small .prompt{font-size:6rem}
.prompt.wide{font-size:clamp(4.5rem,18vw,7rem)}
.square.small .prompt.wide{font-size:4.2rem}
.prompt.romaji{font-family:var(--f-ui);font-weight:500;font-size:clamp(3.6rem,15vw,5.8rem)}
.prompt-note{position:absolute;bottom:7%;left:0;right:0;text-align:center;font-size:.8rem;color:var(--muted);z-index:1}
.timer{font-family:var(--f-num);font-size:2rem;text-align:center;font-variant-numeric:tabular-nums}
.timer.stopped{color:var(--indigo)}
.answer{min-height:5.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.ans-main{font-size:2.1rem;font-weight:700;line-height:1.15}
.ans-main .k,.k{font-family:var(--f-kana);font-weight:600}
.ans-ex{color:var(--muted)}
.ans-ex b{font-family:var(--f-kana);font-weight:600;color:var(--ink);font-size:1.15rem}
.ans-tip{font-size:.85rem;color:var(--learn)}
.hint{color:var(--muted);font-size:.9rem}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rate button,.btn{border-radius:8px;padding:12px;font-weight:700;border:1.5px solid}
.rate button:disabled{opacity:.35;cursor:default}
.b-miss{background:var(--miss-soft);border-color:var(--miss);color:var(--miss)}
.b-got{background:var(--done-soft);border-color:var(--done);color:var(--done)}
.btn{background:var(--indigo);border-color:var(--indigo);color:var(--on-indigo)}
.btn.quiet{background:transparent;color:var(--indigo)}
kbd{font-family:var(--f-num);font-size:.72rem;border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-left:6px;opacity:.75}
.keys{font-size:.8rem;color:var(--muted);text-align:center}
.keys kbd{margin-left:0}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--sheet);border-radius:8px;padding:12px 10px;font-weight:700;font-size:1.15rem;display:flex;align-items:center;justify-content:center;gap:8px;position:relative}
.opt.kana{font-family:var(--f-kana);font-size:1.9rem;padding:4px 10px}
.opt .n{position:absolute;left:8px;top:6px;font-family:var(--f-num);font-size:.68rem;color:var(--muted);font-weight:500}
.opt:hover:not(:disabled){border-color:var(--indigo)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--done);background:var(--done-soft);color:var(--done)}
.opt.wrong{border-color:var(--miss);background:var(--miss-soft);color:var(--miss)}
.typed{display:flex;gap:8px}
.typed input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:8px;padding:11px 12px;font-family:var(--f-num);font-size:1.05rem}
.typed input.ok{border-color:var(--done)} .typed input.bad{border-color:var(--miss)}
.fb{border-radius:8px;padding:10px 12px;font-size:.92rem;border:1.5px solid}
.fb.ok{background:var(--done-soft);border-color:var(--done)}
.fb.bad{background:var(--miss-soft);border-color:var(--miss)}
.fb .tip{display:block;color:var(--learn);font-size:.85rem;margin-top:4px}
.fb .k{font-size:1.15rem}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:14px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-num);font-size:1.15rem;font-variant-numeric:tabular-nums}
.recent{display:flex;flex-wrap:wrap;gap:6px;min-height:28px}
.chip{font-family:var(--f-num);font-size:.78rem;padding:2px 8px;border-radius:999px;background:var(--indigo-soft);display:inline-flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.chip .k{font-size:.95rem;font-weight:400}
.chip.dnf{background:var(--miss-soft);color:var(--miss)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}

/* Reference card */
.ref{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.ref-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ref-head .square{margin:0;flex:none}
.ref-body{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.ref-r{font-size:2.2rem;font-weight:700;line-height:1}
.ref-ex b{font-family:var(--f-kana);font-weight:600;font-size:1.25rem}
.ref-ex span{color:var(--muted)}
.ref-tip{font-size:.88rem;color:var(--learn)}
.ref-rec{font-family:var(--f-num);font-size:.8rem;color:var(--muted)}
.intro{color:var(--muted);font-size:.9rem;margin:0}

/* Chart */
.chart{display:flex;flex-direction:column;gap:14px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button,.toggle{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:.82rem}
.quick button:hover{border-color:var(--indigo)}
.toggle[aria-pressed="true"]{border-color:var(--indigo);color:var(--indigo);background:var(--indigo-soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;border:1.5px solid}
.sw.new{border-color:var(--line);background:var(--sheet)}
.sw.learning{border-color:var(--learn);background:var(--learn-soft)}
.sw.learned{border-color:var(--done);background:var(--done-soft)}
.sec{display:flex;flex-direction:column;gap:6px}
.sec h2{margin:0;font-size:.95rem;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h2 span{font-weight:400;color:var(--muted);font-size:.8rem}
.grid{overflow-x:auto}
.row{display:grid;grid-template-columns:4.2rem repeat(5,minmax(2.6rem,1fr));gap:5px;margin-bottom:5px}
.row.y{grid-template-columns:4.2rem repeat(3,minmax(2.6rem,1fr))}
.rowbtn{border:1.5px dashed var(--line);background:transparent;border-radius:6px;font-size:.78rem;color:var(--muted);padding:0 4px;display:flex;align-items:center;justify-content:center;gap:4px}
.rowbtn .k{font-size:1rem;font-weight:400}
.rowbtn[aria-pressed="true"]{border-style:solid;border-color:var(--indigo);background:var(--indigo);color:var(--on-indigo)}
.cell{position:relative;border:1.5px solid var(--line);background:var(--sheet);border-radius:6px;padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;line-height:1.1;min-height:3.3rem}
.cell .k{font-size:1.45rem;font-weight:400}
.cell .r{font-size:.66rem;color:var(--muted)}
.cell .t{font-family:var(--f-num);font-size:.6rem;color:var(--muted);font-variant-numeric:tabular-nums;min-height:.7rem}
.cell.learning{border-color:var(--learn);background:var(--learn-soft)}
.cell.learned{border-color:var(--done);background:var(--done-soft)}
.cell.off{opacity:.45}
.cell.now{box-shadow:0 0 0 2px var(--indigo)}
.gap{visibility:hidden}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.reset{border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 10px;font-size:.8rem;color:var(--muted)}
.reset.armed{border-color:var(--miss);color:var(--miss);background:var(--miss-soft)}
@media (max-width:460px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:3.4rem repeat(5,minmax(2.3rem,1fr))}.row.y{grid-template-columns:3.4rem repeat(3,minmax(2.3rem,1fr))}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ひらがな <small>Kana Drill</small></h1>
    <div class="save" id="save"><i></i><span>Loading progress…</span></div>
  </header>

  <nav class="tabs" aria-label="Mode">
    <button data-tab="chart">Chart<small>Look things up</small></button>
    <button data-tab="mc">Multiple choice<small>Pick from 4</small></button>
    <button data-tab="recall">Recall<small>No timer, no options</small></button>
    <button data-tab="timed">Timed drill<small>Speed and ao5</small></button>
  </nav>

  <div class="main">
    <section class="panel tool" id="tool" aria-live="polite"></section>

    <section class="panel chart" aria-label="Hiragana chart">
      <div class="trow">
        <span class="label" id="chartLabel">Hiragana chart</span>
        <button class="toggle" id="skipLearned" aria-pressed="false">Skip learned</button>
      </div>
      <div class="quick">
        <button data-q="basic">All basic</button>
        <button data-q="daku">All ゛゜</button>
        <button data-q="yoon">All yōon</button>
        <button data-q="learning">Rows I'm learning</button>
        <button data-q="clear">Clear</button>
      </div>
      <div class="legend">
        <span><i class="sw new"></i>New</span>
        <span><i class="sw learning"></i>Learning</span>
        <span><i class="sw learned"></i>Learned</span>
        <span>Small number = average timed recall (s)</span>
      </div>
      <div id="sections"></div>
      <div class="foot">
        <span id="footText"></span>
        <button class="reset" id="reset">Reset progress</button>
      </div>
    </section>
  </div>
</div>

<script>
(() => {
// ============================ DATA ============================
const D = {
basic: [
 ['a','あ',['あ|a|あめ|ame|rain','い|i|いぬ|inu|dog','う|u|うみ|umi|sea','え|e|えき|eki|station','お|o|おか|oka|hill']],
 ['ka','か',['か|ka|かさ|kasa|umbrella','き|ki|きた|kita|north','く|ku|くも|kumo|cloud','け|ke|けむり|kemuri|smoke','こ|ko|こえ|koe|voice']],
 ['sa','さ',['さ|sa|さかな|sakana|fish','し|shi|しま|shima|island','す|su|すし|sushi|sushi','せ|se|せかい|sekai|world','そ|so|そら|sora|sky']],
 ['ta','た',['た|ta|たこ|tako|octopus','ち|chi|ちず|chizu|map','つ|tsu|つき|tsuki|moon','て|te|てがみ|tegami|letter','と|to|とり|tori|bird']],
 ['na','な',['な|na|なみ|nami|wave','に|ni|にく|niku|meat','ぬ|nu|ぬの|nuno|cloth','ね|ne|ねこ|neko|cat','の|no|のり|nori|seaweed']],
 ['ha','は',['は|ha|はし|hashi|bridge','ひ|hi|ひと|hito|person','ふ|fu|ふね|fune|boat','へ|he|へや|heya|room','ほ|ho|ほし|hoshi|star']],
 ['ma','ま',['ま|ma|まど|mado|window','み|mi|みず|mizu|water','む|mu|むし|mushi|insect','め|me|めがね|megane|glasses','も|mo|もり|mori|forest']],
 ['ya','や',['や|ya|やま|yama|mountain',null,'ゆ|yu|ゆき|yuki|snow',null,'よ|yo|よる|yoru|night']],
 ['ra','ら',['ら|ra|らいねん|rainen|next year','り|ri|りんご|ringo|apple','る|ru|るす|rusu|not at home','れ|re|れきし|rekishi|history','ろ|ro|ろうそく|rōsoku|candle']],
 ['wa','わ',['わ|wa|わたし|watashi|I, me',null,null,null,'を|o|ほんをよむ|hon o yomu|read a book']],
 ['n','ん',['ん|n|ほん|hon|book',null,null,null,null]]
],
daku: [
 ['ga','が',['が|ga|がっこう|gakkō|school','ぎ|gi|ぎんこう|ginkō|bank','ぐ|gu|かぐ|kagu|furniture','げ|ge|げんき|genki|well, lively','ご|go|ごはん|gohan|rice, meal']],
 ['za','ざ',['ざ|za|ざっし|zasshi|magazine','じ|ji|じかん|jikan|time','ず|zu|すずめ|suzume|sparrow','ぜ|ze|かぜ|kaze|wind','ぞ|zo|ぞう|zō|elephant']],
 ['da','だ',['だ|da|だいがく|daigaku|university','ぢ|ji|はなぢ|hanaji|nosebleed','づ|zu|つづく|tsuzuku|to continue','で|de|でんわ|denwa|telephone','ど|do|どうぶつ|dōbutsu|animal']],
 ['ba','ば',['ば|ba|ばしょ|basho|place','び|bi|えび|ebi|prawn','ぶ|bu|ぶた|buta|pig','べ|be|べんきょう|benkyō|study','ぼ|bo|ぼうし|bōshi|hat']],
 ['pa','ぱ',['ぱ|pa|かんぱい|kanpai|cheers','ぴ|pi|えんぴつ|enpitsu|pencil','ぷ|pu|てんぷら|tenpura|tempura','ぺ|pe|ぺらぺら|perapera|fluent','ぽ|po|さんぽ|sanpo|a walk']]
],
yoon: [
 ['kya','きゃ',['きゃ|kya|きゃく|kyaku|guest','きゅ|kyu|きゅう|kyū|nine','きょ|kyo|きょう|kyō|today']],
 ['sha','しゃ',['しゃ|sha|しゃしん|shashin|photo','しゅ|shu|しゅくだい|shukudai|homework','しょ|sho|しょくどう|shokudō|canteen']],
 ['cha','ちゃ',['ちゃ|cha|おちゃ|ocha|tea','ちゅ|chu|ちゅうい|chūi|caution','ちょ|cho|ちょっと|chotto|a little']],
 ['nya','にゃ',['にゃ|nya|こんにゃく|konnyaku|konjac','にゅ|nyu|にゅうがく|nyūgaku|starting school','にょ|nyo||']],
 ['hya','ひゃ',['ひゃ|hya|ひゃく|hyaku|hundred','ひゅ|hyu||','ひょ|hyo|ひょう|hyō|chart; hail']],
 ['mya','みゃ',['みゃ|mya|みゃく|myaku|pulse','みゅ|myu||','みょ|myo|みょうじ|myōji|surname']],
 ['rya','りゃ',['りゃ|rya|りゃく|ryaku|abbreviation','りゅ|ryu|りゅう|ryū|dragon','りょ|ryo|りょこう|ryokō|travel']],
 ['gya','ぎゃ',['ぎゃ|gya|ぎゃく|gyaku|opposite','ぎゅ|gyu|ぎゅうにゅう|gyūnyū|milk','ぎょ|gyo|ぎょうざ|gyōza|dumplings']],
 ['ja','じゃ',['じゃ|ja|じゃま|jama|nuisance','じゅ|ju|じゅぎょう|jugyō|lesson','じょ|jo|じょうず|jōzu|skilful']],
 ['bya','びゃ',['びゃ|bya|さんびゃく|sanbyaku|three hundred','びゅ|byu||','びょ|byo|びょういん|byōin|hospital']],
 ['pya','ぴゃ',['ぴゃ|pya|はっぴゃく|happyaku|eight hundred','ぴゅ|pyu||','ぴょ|pyo|はっぴょう|happyō|presentation']]
]};
const LOOK = {'め':['ぬ'],'ぬ':['め'],'ね':['れ','わ'],'れ':['ね','わ'],'わ':['ね','れ'],'る':['ろ'],'ろ':['る'],'さ':['ち','き'],'ち':['さ'],'き':['さ'],'は':['ほ'],'ほ':['は'],'い':['り'],'り':['い'],'し':['つ'],'つ':['し'],'あ':['お'],'お':['あ'],'こ':['に'],'に':['こ'],'ま':['も'],'も':['ま']};
const TIPS = {
 'ぬめ':'ぬ ends in a little loop; め does not.',
 'ねれ':'ね ends in a loop; れ kicks out to the right.',
 'ねわ':'ね ends in a loop; わ just curves round.',
 'れわ':'れ kicks out at the end; わ curves round with no kick.',
 'るろ':'る has a loop at the bottom; ろ is open.',
 'さち':'さ opens to the right like a c; ち opens to the left.',
 'きさ':'き has two crossbars; さ has one.',
 'はほ':'ほ has two crossbars; は has one.',
 'いり':'り flows as one shape with a long right stroke; い has two short strokes.',
 'しつ':'し hooks downward; つ hooks across.',
 'あお':'お has a dot at the top right; あ has none.',
 'こに':'に has an extra vertical stroke on the left.',
 'まも':'ま has two crossbars and a loop; も has a hook and no loop.'
};
const NOTE = {'は':'Read wa when it is the topic particle.','へ':'Read e when it is the direction particle.','を':'Only used as the object particle. Sounds like o.','ぢ':'Rare. じ is the usual way to write ji.','づ':'Rare. ず is the usual way to write zu.','ん':'The only lone consonant, and still a whole mora.'};
const R2K_NOTE = {'ぢ':'rare form · ち + ゛','づ':'rare form · つ + ゛','を':'object particle','じ':'common form','ず':'common form','お':'vowel, not the particle'};
const EXTRA_ALT = {'を':['wo'],'ん':['nn'],'ぢ':['di','dzi'],'づ':['du','dzu']};

const ROWS = {}, KANA = {}, ORDER = [];
for (const g of ['basic','daku','yoon']) for (const [id,label,cells] of D[g]) {
  ROWS[id] = {id,label,group:g,cells:cells.map(c => c ? c.split('|')[0] : null)};
  for (const c of cells) if (c) { const [k,r,w,wr,m] = c.split('|'); KANA[k] = {k,r,w,wr,m,row:id}; ORDER.push(k); }
}
const tipFor = (a,b) => TIPS[[a,b].sort().join('')] || '';
const lookTips = k => (LOOK[k]||[]).map(x => tipFor(k,x)).filter(Boolean);
function alts(k){
  const r = KANA[k].r, s = new Set([r]);
  ({shi:'si',chi:'ti',tsu:'tu',fu:'hu',ji:'zi'})[r] && s.add(({shi:'si',chi:'ti',tsu:'tu',fu:'hu',ji:'zi'})[r]);
  if (/^sh[auo]$/.test(r)) s.add('sy'+r[2]);
  if (/^ch[auo]$/.test(r)) { s.add('ty'+r[2]); s.add('cy'+r[2]); }
  if (/^j[auo]$/.test(r)) { s.add('zy'+r[1]); s.add('jy'+r[1]); }
  (EXTRA_ALT[k]||[]).forEach(x => s.add(x));
  return s;
}

// ============================ STATE ============================
const DEFAULT = {v:2, cards:{}, sel:['a','ka'], mode:'k2r', skip:false, tab:'chart', focus:'あ'};
let S = JSON.parse(JSON.stringify(DEFAULT));
const sess = {list:[], n:0, ok:0, streak:0, best:0};
let cur = null, last = null, t0 = 0, raf = 0, revealed = false, answered = false, revealMs = 0;
let options = [], picked = null, fb = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const card = k => S.cards[k] || (S.cards[k] = {s:'new', t:[], c:0, m:0, k:0});
const status = k => (S.cards[k] && S.cards[k].s) || 'new';
const avg = a => a && a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const fmt = ms => ms == null ? '–' : (ms/1000).toFixed(2);
const shuffle = a => { a = [...a]; for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

// ============================ PERSISTENCE ============================
const LS = 'kana-drill-v1';
let ref = null, saveTimer = 0, writing = false, dirty = false;
function setSave(text, ok){ const el=$('save'); el.className='save'+(ok?' ok':''); el.querySelector('span').textContent=text; }
function loadLocal(){ try{ const j = JSON.parse(localStorage.getItem(LS)||'null'); if (j && j.cards) S = Object.assign(S, j); }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function persist(){ saveLocal(); dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1200); }
async function flush(){
  if (!ref || writing || !dirty) return;
  writing = true; dirty = false;
  try { await ref.set(JSON.parse(JSON.stringify(S))); setSave('Saved to your account', true); }
  catch(e){ if (e && ['invalid_argument','not_granted','revoked'].includes(e.code)) { ref=null; setSave('Saved in this browser only', false); } else dirty = true; }
  writing = false;
  if (dirty) saveTimer = setTimeout(flush, 1500);
}
async function initDb(){
  try {
    if (!window.claude || !claude.use) { setSave('Saved in this browser only', false); return; }
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const id = user && await user.id();
    if (!db || !id) { setSave('Saved in this browser only', false); return; }
    ref = db.doc('data/users/' + id + '/progress');
    const snap = await ref.get();
    if (snap.exists) {
      S = Object.assign(JSON.parse(JSON.stringify(DEFAULT)), JSON.parse(JSON.stringify(snap.data())));
      saveLocal(); buildChart(); setTab(S.tab, true);
      setSave('Saved to your account', true);
    } else { dirty = true; await flush(); }
  } catch(e){ ref = null; setSave('Saved in this browser only', false); }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearTimeout(saveTimer); flush(); }
  else if (S.tab==='timed' && !revealed) t0 = performance.now();
});

// ============================ PICKING ============================
function pool(){
  const p = [];
  for (const id of S.sel) for (const k of (ROWS[id]?.cells||[])) if (k && !(S.skip && status(k)==='learned')) p.push(k);
  return p;
}
function weight(k){
  const c = card(k), a = avg(c.t);
  let w = c.s==='learned' ? 1 : c.s==='learning' ? 4 : 3;
  if (S.tab==='timed' && a) w += Math.min(a/1000, 6) * .6;
  if (c.m > c.c) w += 1.5;
  return w;
}
function pick(){
  const p = pool(); if (!p.length) return null;
  const cand = p.length > 1 ? p.filter(k => k !== last) : p;
  let tot = 0; const ws = cand.map(k => (tot += weight(k)));
  const r = Math.random()*tot; return cand[ws.findIndex(x => x >= r)];
}
function buildOptions(k){
  const K = KANA[k], p = pool();
  if (S.mode === 'k2r'){
    const seen = new Set([K.r]), out = [];
    for (const x of [...(LOOK[k]||[]), ...shuffle(p.filter(x => KANA[x].row===K.row)), ...shuffle(p), ...shuffle(ORDER)]){
      const r = KANA[x].r; if (!seen.has(r)) { seen.add(r); out.push(r); } if (out.length===3) break;
    }
    return shuffle([K.r, ...out]);
  }
  const out = [];
  for (const x of [...(LOOK[k]||[]), ...shuffle(p.filter(x => KANA[x].row===K.row)), ...shuffle(p), ...shuffle(ORDER)]){
    if (x!==k && KANA[x].r!==K.r && !out.includes(x)) out.push(x); if (out.length===3) break;
  }
  return shuffle([k, ...out]);
}

// ============================ GRADING ============================
function grade(ok, given){
  const c = card(cur), timed = S.tab==='timed';
  sess.n++;
  if (ok){
    sess.ok++; sess.streak++; sess.best = Math.max(sess.best, sess.streak);
    c.c++; c.k++;
    if (timed && revealMs < 30000) { c.t.push(Math.round(revealMs)); if (c.t.length>5) c.t.shift(); }
    const a = avg(c.t);
    if (c.k >= 3 && (!timed || (a != null && a < 3000))) c.s = 'learned';
    else if (c.s === 'new') c.s = 'learning';
    if (timed) sess.list.push({k:cur, ms: revealMs < 30000 ? revealMs : null});
  } else {
    sess.streak = 0; c.m++; c.k = 0; c.s = 'learning';
    if (timed) sess.list.push({k:cur, ms:Infinity});
  }
  // feedback text for mc / typed recall
  const K = KANA[cur];
  let msg = ok ? 'Correct. ' : 'Not quite. ';
  msg += S.mode==='k2r' ? '<span class="k">'+cur+'</span> is '+esc(K.r)+'.' : esc(K.r)+' is <span class="k">'+cur+'</span>.';
  let tip = '';
  if (!ok){
    let mix = null;
    if (S.mode==='r2k' && given && KANA[given]) mix = given;
    if (S.mode==='k2r' && given) mix = ORDER.find(x => x!==cur && (KANA[x].r===given || alts(x).has(given))) || null;
    if (mix){
      msg += S.mode==='k2r' ? ' You read it as <span class="k">'+mix+'</span>.' : ' You picked <span class="k">'+mix+'</span>, which is '+esc(KANA[mix].r)+'.';
      tip = tipFor(cur, mix);
    }
    if (!tip && !mix) tip = lookTips(cur)[0] || '';
  }
  if (NOTE[cur]) tip = (tip ? tip+' ' : '') + NOTE[cur];
  fb = {ok, msg, tip};
  last = cur; persist(); renderCell(cur);
}

// ============================ TOOL PANEL ============================
function setTab(t, keep){
  S.tab = t; if (!keep) persist();
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab===t));
  $('chartLabel').textContent = t==='chart' ? 'Hiragana chart' : 'Choose sections to test';
  $('footText').textContent = t==='chart'
    ? 'Tap a kana to look it up. Tap a row label to include that row in tests.'
    : 'Tap a row label to add or remove it. Tap a kana to change its status.';
  cancelAnimationFrame(raf);
  if (t==='chart') renderRef(); else next();
}
function directionBar(){
  return '<div class="trow"><div class="seg" role="group" aria-label="Direction">'
    + '<button data-dir="k2r" aria-pressed="'+(S.mode==='k2r')+'">かな → romaji</button>'
    + '<button data-dir="r2k" aria-pressed="'+(S.mode==='r2k')+'">romaji → かな</button></div>'
    + '<span class="label">'+pool().length+' kana in test</span></div>';
}
function promptSquare(tap){
  const K = KANA[cur];
  if (S.mode==='k2r') return '<div class="square'+(tap?' tap':'')+'" id="square"'+(tap?' role="button" tabindex="0" aria-label="Reveal answer"':'')+'><div class="prompt'+(cur.length>1?' wide':'')+'">'+cur+'</div></div>';
  return '<div class="square'+(tap?' tap':'')+'" id="square"'+(tap?' role="button" tabindex="0" aria-label="Reveal answer"':'')+'><div class="prompt romaji">'+esc(K.r)+'</div><div class="prompt-note">'+esc(R2K_NOTE[cur]||'')+'</div></div>';
}
function answerBlock(){
  const K = KANA[cur];
  let h = S.mode==='k2r' ? '<div class="ans-main">'+esc(K.r)+'</div>' : '<div class="ans-main"><span class="k">'+cur+'</span></div>';
  if (K.w) h += '<div class="ans-ex"><b>'+K.w+'</b> · '+esc(K.wr)+' · '+esc(K.m)+'</div>';
  const tips = [NOTE[cur], ...lookTips(cur).map(t => t)].filter(Boolean);
  if (tips.length) h += '<div class="ans-tip">'+esc(tips.join(' '))+'</div>';
  return h;
}
function exampleLine(){ const K = KANA[cur]; return K.w ? '<div class="ans-ex"><b>'+K.w+'</b> · '+esc(K.wr)+' · '+esc(K.m)+'</div>' : ''; }
function feedbackBlock(){ return fb ? '<div class="fb '+(fb.ok?'ok':'bad')+'">'+fb.msg+(fb.tip?'<span class="tip">'+esc(fb.tip)+'</span>':'')+'</div>' : ''; }
function scoreStats(){
  return '<div class="stats">'
    + '<div class="stat"><span class="label">Answered</span><span class="v">'+sess.n+'</span></div>'
    + '<div class="stat"><span class="label">Accuracy</span><span class="v">'+(sess.n?Math.round(100*sess.ok/sess.n)+'%':'–')+'</span></div>'
    + '<div class="stat"><span class="label">Streak</span><span class="v">'+sess.streak+'</span></div>'
    + '<div class="stat"><span class="label">Best streak</span><span class="v">'+sess.best+'</span></div></div>';
}
function emptyState(){
  $('tool').innerHTML = directionBar() + '<p class="empty">'+(S.sel.length ? 'Everything in these rows is marked learned. Turn off “Skip learned” or add a row.' : 'Pick at least one row from the chart to start a test.')+'</p>';
}

function next(){
  cancelAnimationFrame(raf);
  cur = pick(); revealed = false; answered = false; picked = null; fb = null;
  markCurrent();
  if (!cur) { emptyState(); return; }
  if (S.tab==='mc') { options = buildOptions(cur); renderMC(); }
  else if (S.tab==='recall') renderRecall();
  else renderTimed();
}

// ---- Multiple choice
function renderMC(){
  let h = directionBar() + promptSquare(false);
  h += '<div class="opts">' + options.map((o,i) => {
    const right = S.mode==='k2r' ? o===KANA[cur].r : o===cur;
    let c = 'opt' + (S.mode==='r2k' ? ' kana' : '');
    if (answered && right) c += ' right';
    if (answered && picked===i && !right) c += ' wrong';
    return '<button class="'+c+'" data-opt="'+i+'"'+(answered?' disabled':'')+'><span class="n">'+(i+1)+'</span>'+(S.mode==='k2r'?esc(o):o)+'</button>';
  }).join('') + '</div>';
  if (answered) h += feedbackBlock() + exampleLine() + '<button class="btn" data-next>Next<kbd>Enter</kbd></button>';
  h += '<div class="keys"><kbd>1</kbd>–<kbd>4</kbd> to answer · <kbd>Enter</kbd> next</div>' + scoreStats();
  $('tool').innerHTML = h;
}
function chooseMC(i){
  if (answered) return;
  answered = true; picked = i;
  const o = options[i];
  grade(S.mode==='k2r' ? o===KANA[cur].r : o===cur, S.mode==='r2k' ? o : null);
  renderMC();
}

// ---- Recall (untimed): type romaji, or reveal + self-rate for romaji → kana
function renderRecall(){
  let h = directionBar();
  if (S.mode==='k2r'){
    h += promptSquare(false);
    h += '<div class="typed"><input id="ans" placeholder="Type the romaji, e.g. shi" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"'+(answered?' readonly class="'+(fb&&fb.ok?'ok':'bad')+'"':'')+'>'
      + '<button class="btn" data-check>'+(answered?'Next':'Check')+'</button></div>';
    if (answered) h += feedbackBlock() + exampleLine();
    else h += '<button class="btn quiet" data-giveup>I don’t know, show me</button>';
    h += '<div class="keys"><kbd>Enter</kbd> to check, then <kbd>Enter</kbd> for the next one</div>';
  } else {
    h += promptSquare(true);
    h += '<div class="answer">'+(revealed ? answerBlock() : '<p class="hint">Write the kana on paper or in the air, then tap the square or press Space.</p>')+'</div>';
    h += '<div class="rate"><button class="b-miss" data-rate="0"'+(revealed?'':' disabled')+'>Missed<kbd>1</kbd></button><button class="b-got" data-rate="1"'+(revealed?'':' disabled')+'>Got it<kbd>2</kbd></button></div>';
  }
  h += scoreStats();
  $('tool').innerHTML = h;
  const inp = $('ans'); if (inp) { if (answered) inp.value = inp.dataset.v || lastTyped; inp.focus({preventScroll:true}); }
}
let lastTyped = '';
function checkTyped(){
  const inp = $('ans'); if (!inp) return;
  if (answered) { next(); return; }
  const v = inp.value.toLowerCase().replace(/[^a-z]/g,'');
  if (!v) return;
  lastTyped = inp.value; answered = true;
  grade(alts(cur).has(v), v); renderRecall();
}
function giveUp(){ if (answered) return; lastTyped = ''; answered = true; grade(false, null); renderRecall(); }

// ---- Timed drill
function renderTimed(){
  let h = directionBar() + promptSquare(true) + '<div class="timer" id="timer">0.00</div>';
  h += '<div class="answer" id="answer"><p class="hint">Say it in your head, then tap the square or press Space.</p></div>';
  h += '<div class="rate"><button class="b-miss" data-rate="0" disabled>Missed<kbd>1</kbd></button><button class="b-got" data-rate="1" disabled>Got it<kbd>2</kbd></button></div>';
  h += '<div class="keys"><kbd>Space</kbd> reveal · <kbd>1</kbd>/<kbd>←</kbd> missed · <kbd>2</kbd>/<kbd>→</kbd> got it</div>';
  h += '<div class="stats">'
    + '<div class="stat"><span class="label">Cards</span><span class="v">'+sess.list.length+'</span></div>'
    + '<div class="stat"><span class="label">Accuracy</span><span class="v">'+(sess.list.length?Math.round(100*sess.list.filter(x=>x.ms!==Infinity).length/sess.list.length)+'%':'–')+'</span></div>'
    + '<div class="stat"><span class="label">ao5</span><span class="v">'+(aoN(5)??'–')+'</span></div>'
    + '<div class="stat"><span class="label">ao12</span><span class="v">'+(aoN(12)??'–')+'</span></div></div>';
  h += '<div class="sec"><span class="label">This session</span><div class="recent">'
    + (sess.list.length ? sess.list.slice(-12).reverse().map(x => '<span class="chip'+(x.ms===Infinity?' dnf':'')+'"><span class="k">'+x.k+'</span>'+(x.ms===Infinity?'DNF':x.ms==null?'—':fmt(x.ms))+'</span>').join('') : '<span class="hint" style="font-size:.82rem">Your recall times appear here. Misses count as DNF.</span>')
    + '</div></div>';
  $('tool').innerHTML = h;
  t0 = performance.now();
  const tick = () => { const el = $('timer'); if (!el) return; el.textContent = ((performance.now()-t0)/1000).toFixed(2); raf = requestAnimationFrame(tick); };
  tick();
}
function aoN(n){
  const L = sess.list.slice(-n).map(x => x.ms);
  if (L.length < n) return null;
  if (L.some(x => x === null)) return '–';
  const mid = [...L].sort((a,b)=>a-b).slice(1, n-1);
  if (mid.some(x => x === Infinity)) return 'DNF';
  return (avg(mid)/1000).toFixed(2);
}

function reveal(){
  if (!cur || revealed || !(S.tab==='timed' || (S.tab==='recall' && S.mode==='r2k'))) return;
  revealed = true;
  if (S.tab==='timed'){
    cancelAnimationFrame(raf); revealMs = performance.now()-t0;
    $('timer').textContent = fmt(revealMs); $('timer').className='timer stopped';
    $('answer').innerHTML = answerBlock();
    document.querySelectorAll('[data-rate]').forEach(b => b.disabled = false);
  } else renderRecall();
}
function rate(ok){
  if (!revealed || !cur) return;
  grade(ok, null); next();
}

// ---- Chart reference card
function renderRef(){
  const k = KANA[S.focus] ? S.focus : 'あ', K = KANA[k], c = S.cards[k] || {s:'new', t:[], c:0, m:0};
  cur = null; markCurrent(); markFocus();
  const tips = [NOTE[k], ...lookTips(k)].filter(Boolean);
  const a = avg(c.t);
  let h = '<p class="intro">Tap any kana on the chart to see it here. Use the row labels to choose what the tests cover.</p>';
  h += '<div class="ref"><div class="ref-head"><div class="square small"><div class="prompt'+(k.length>1?' wide':'')+'">'+k+'</div></div>'
    + '<div class="ref-body"><div class="ref-r">'+esc(K.r)+'</div>'
    + (K.w ? '<div class="ref-ex"><b>'+K.w+'</b> <span>'+esc(K.wr)+' · '+esc(K.m)+'</span></div>' : '<div class="ref-ex"><span>Mostly seen in loanwords and sound effects.</span></div>')
    + '</div></div>'
    + (tips.length ? '<div class="ref-tip">'+esc(tips.join(' '))+'</div>' : '')
    + '<div class="trow"><div class="seg" role="group" aria-label="Status">'
    + ['new','learning','learned'].map(s => '<button data-status="'+s+'" aria-pressed="'+(c.s===s)+'">'+s[0].toUpperCase()+s.slice(1)+'</button>').join('')
    + '</div><span class="ref-rec">'+(c.c||0)+' right · '+(c.m||0)+' missed'+(a?' · avg '+fmt(a)+' s':'')+'</span></div>'
    + '<div class="trow"><span class="hint">'+(S.sel.includes(K.row) ? 'The '+ROWS[K.row].label+' row is in your tests.' : 'The '+ROWS[K.row].label+' row is not in your tests.')+'</span>'
    + '<button class="btn quiet" data-togglerow="'+K.row+'" style="padding:6px 12px">'+(S.sel.includes(K.row)?'Remove row':'Add row')+'</button></div>'
    + '</div>';
  $('tool').innerHTML = h;
}

// ============================ CHART ============================
const SEC = [['basic','Basic gojūon','46 kana',5],['daku','Dakuten ゛ and handakuten ゜','25 kana',5],['yoon','Yōon combinations','33 kana',3]];
function buildChart(){
  const host = $('sections'); host.innerHTML = '';
  for (const [g,title,sub,cols] of SEC){
    const sec = document.createElement('div'); sec.className='sec';
    sec.innerHTML = '<h2>'+title+'<span>'+sub+'</span></h2>';
    const grid = document.createElement('div'); grid.className='grid';
    for (const [id] of D[g]){
      const R = ROWS[id], row = document.createElement('div'); row.className='row'+(cols===3?' y':'');
      const b = document.createElement('button'); b.className='rowbtn'; b.dataset.row=id;
      b.innerHTML='<span class="k">'+R.label+'</span>'; b.title='Include the '+R.label+' row in tests';
      row.appendChild(b);
      for (const k of R.cells){
        if (!k){ const gp = document.createElement('div'); gp.className='gap'; row.appendChild(gp); continue; }
        const c = document.createElement('button'); c.className='cell'; c.dataset.k=k; row.appendChild(c);
      }
      grid.appendChild(row);
    }
    sec.appendChild(grid); host.appendChild(sec);
  }
  refreshRows();
  $('skipLearned').setAttribute('aria-pressed', !!S.skip);
}
function renderCell(k){
  const el = document.querySelector('.cell[data-k="'+k+'"]'); if (!el) return;
  const c = S.cards[k] || {s:'new', t:[]}, K = KANA[k], a = avg(c.t);
  el.className = 'cell ' + c.s + (S.sel.includes(K.row) ? '' : ' off') + (k===cur || (S.tab==='chart' && k===S.focus) ? ' now' : '');
  el.innerHTML = '<span class="k">'+k+'</span><span class="r">'+esc(K.r)+'</span><span class="t">'+(a ? fmt(a) : '')+'</span>';
  el.setAttribute('aria-label', k+' '+K.r+', '+c.s+(a ? ', average '+fmt(a)+' seconds' : ''));
}
function markCurrent(){ document.querySelectorAll('.cell.now').forEach(e => e.classList.remove('now')); if (cur) document.querySelector('.cell[data-k="'+cur+'"]')?.classList.add('now'); }
function markFocus(){ if (S.tab==='chart') document.querySelector('.cell[data-k="'+S.focus+'"]')?.classList.add('now'); }
function refreshRows(){
  document.querySelectorAll('.rowbtn').forEach(b => b.setAttribute('aria-pressed', S.sel.includes(b.dataset.row)));
  ORDER.forEach(renderCell);
}
function selectionChanged(){
  persist(); refreshRows();
  if (S.tab==='chart') renderRef();
  else if (!cur || !pool().includes(cur)) next();
  else { const l = document.querySelector('#tool .trow .label'); if (l) l.textContent = pool().length+' kana in test'; }
}
function toggleRow(id){ S.sel = S.sel.includes(id) ? S.sel.filter(x => x!==id) : [...S.sel, id]; selectionChanged(); }
function setStatus(k, s){ const c = card(k); c.s = s; if (s!=='learned') c.k = 0; persist(); renderCell(k); }

// ============================ EVENTS ============================
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { setTab(b.dataset.tab); b.blur(); } });
$('sections').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; b.blur();
  if (b.dataset.row) toggleRow(b.dataset.row);
  else if (b.dataset.k){
    const k = b.dataset.k;
    if (S.tab==='chart'){
      S.focus = k; persist(); renderRef(); ORDER.forEach(renderCell);
      if (window.matchMedia('(max-width:860px)').matches) $('tool').scrollIntoView({behavior:'smooth', block:'start'});
    } else {
      const s = status(k); setStatus(k, s==='new' ? 'learning' : s==='learning' ? 'learned' : 'new');
      if (S.skip && k===cur && status(k)==='learned') next();
    }
  }
});
$('tool').addEventListener('click', e => {
  if (e.target.closest('#square')) { reveal(); return; }
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.dir){ S.mode = b.dataset.dir; persist(); next(); }
  else if (b.dataset.opt !== undefined) chooseMC(+b.dataset.opt);
  else if (b.hasAttribute('data-next')) next();
  else if (b.hasAttribute('data-check')) checkTyped();
  else if (b.hasAttribute('data-giveup')) giveUp();
  else if (b.dataset.rate !== undefined) rate(b.dataset.rate==='1');
  else if (b.dataset.status){ setStatus(S.focus, b.dataset.status); renderRef(); }
  else if (b.dataset.togglerow) toggleRow(b.dataset.togglerow);
});
document.querySelectorAll('.quick button').forEach(b => b.onclick = () => {
  const q = b.dataset.q;
  if (q==='clear') S.sel = [];
  else if (q==='learning') S.sel = Object.keys(ROWS).filter(id => ROWS[id].cells.some(k => k && status(k)==='learning'));
  else { const ids = D[q].map(r => r[0]); const all = ids.every(i => S.sel.includes(i)); S.sel = all ? S.sel.filter(i => !ids.includes(i)) : [...new Set([...S.sel, ...ids])]; }
  b.blur(); selectionChanged();
});
$('skipLearned').onclick = e => { S.skip = !S.skip; e.currentTarget.setAttribute('aria-pressed', S.skip); e.currentTarget.blur(); persist(); if (S.tab!=='chart') next(); };
let armed = 0;
$('reset').onclick = e => {
  const b = e.currentTarget;
  if (!armed){ b.classList.add('armed'); b.textContent='Tap again to erase all progress'; armed = setTimeout(() => { armed=0; b.classList.remove('armed'); b.textContent='Reset progress'; }, 4000); return; }
  clearTimeout(armed); armed = 0; b.classList.remove('armed'); b.textContent='Reset progress';
  S.cards = {}; sess.list = []; sess.n = sess.ok = sess.streak = sess.best = 0; persist(); ORDER.forEach(renderCell); setTab(S.tab, true);
};
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || S.tab==='chart') return;
  const k = e.key;
  if (e.target.id === 'ans'){ if (k==='Enter'){ e.preventDefault(); checkTyped(); } return; }
  if (e.target.closest && e.target.closest('.tabs,.chart,.seg') && (k===' '||k==='Enter')) return;
  if (S.tab==='mc'){
    if (!answered && /^[1-4]$/.test(k)) { e.preventDefault(); chooseMC(+k-1); }
    else if (answered && (k==='Enter'||k===' ')) { e.preventDefault(); next(); }
    return;
  }
  if (S.tab==='recall' && S.mode==='k2r') return;
  if (k===' '||k==='Enter'){ e.preventDefault(); reveal(); }
  else if (revealed && (k==='1'||k==='ArrowLeft')) { e.preventDefault(); rate(false); }
  else if (revealed && (k==='2'||k==='ArrowRight')) { e.preventDefault(); rate(true); }
});

loadLocal(); buildChart(); setTab(S.tab || 'chart', true); initDb();
})();
</script>
